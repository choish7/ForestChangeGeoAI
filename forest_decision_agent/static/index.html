<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>산림변화 의사결정 지원</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--g:#2f6b3a;--g2:#e8f0e8;--bd:#d5ddd5;--tx:#1f2a1f;--mut:#667066;--bg:#fafbfa}
*{box-sizing:border-box}
body{margin:0;font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;color:var(--tx);background:var(--bg);height:100vh;display:flex;flex-direction:column;font-size:14px}
header{background:var(--g);color:#fff;padding:8px 14px;display:flex;align-items:center;gap:12px}
header h1{font-size:16px;margin:0;font-weight:600}
header .st{font-size:12px;opacity:.9;margin-left:auto}
main{flex:1;display:flex;min-height:0}
#side{width:370px;min-width:320px;display:flex;flex-direction:column;border-right:1px solid var(--bd);background:#fff}
#tabs{display:flex;border-bottom:1px solid var(--bd)}
#tabs button{flex:1;border:0;background:none;padding:9px 2px;cursor:pointer;font:inherit;color:var(--mut);border-bottom:2px solid transparent}
#tabs button.on{color:var(--g);border-bottom-color:var(--g);font-weight:600}
.pane{display:none;padding:12px;overflow:auto;flex:1}
.pane.on{display:block}
#map{flex:1;min-width:300px}
#right{width:520px;min-width:360px;display:flex;flex-direction:column;border-left:1px solid var(--bd);background:#fff}
#right .hd{padding:8px 12px;border-bottom:1px solid var(--bd);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#right .hd b{margin-right:auto;color:var(--g);font-size:13px}
#rep{flex:1;width:100%;border:0}
#right .empty{padding:24px;color:var(--mut)}
textarea,input,select{font:inherit;width:100%;padding:6px 8px;border:1px solid var(--bd);border-radius:4px}
textarea{height:110px;resize:vertical}
button.b{background:var(--g);color:#fff;border:0;border-radius:4px;padding:6px 12px;cursor:pointer;font:inherit}
button.b2{background:#fff;color:var(--g);border:1px solid var(--g);border-radius:4px;padding:4px 9px;cursor:pointer;font:inherit;font-size:13px}
button:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:6px;align-items:center;margin:6px 0;flex-wrap:wrap}
.chip{display:inline-block;background:var(--g2);border-radius:12px;padding:2px 9px;margin:2px;font-size:12px;cursor:pointer}
.area{background:#fff8e6;border:1px solid #f0d58a;border-radius:4px;padding:6px 8px;font-size:13px}
.log{background:#1e241e;color:#cfe3cf;font:12px Consolas,monospace;padding:8px;border-radius:4px;max-height:260px;overflow:auto;white-space:pre-wrap;margin-top:8px}
h3{font-size:14px;margin:12px 0 6px;color:var(--g)}
table{border-collapse:collapse;width:100%;font-size:12px}
td,th{border:1px solid var(--bd);padding:3px 5px;text-align:left;vertical-align:top}
th{background:var(--g2)}
.kv td:first-child{color:var(--mut);width:42%;white-space:nowrap}
.res{padding:6px;border-bottom:1px solid #eee;cursor:pointer}.res:hover{background:var(--g2)}
.res small{color:var(--mut)}
.muted{color:var(--mut);font-size:12px}
.legend{background:#fff;padding:6px 8px;border-radius:4px;box-shadow:0 1px 4px rgba(0,0,0,.3);font-size:12px;line-height:1.5}
.legend i{display:inline-block;width:12px;height:12px;margin-right:5px;vertical-align:-2px;border:1px solid #555}
.hlnum{background:#ff3b1f;color:#fff;border:2px solid #fff;border-radius:50%;width:26px;height:26px;line-height:22px;text-align:center;
  font-weight:700;font-size:13px;animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,59,31,.75)}70%{box-shadow:0 0 0 13px rgba(255,59,31,0)}100%{box-shadow:0 0 0 0 rgba(255,59,31,0)}}
.hllist{background:#fff;border-radius:6px;box-shadow:0 1px 6px rgba(0,0,0,.35);max-height:320px;overflow:auto;font-size:12px;width:250px}
.hllist .t{background:#ff3b1f;color:#fff;padding:5px 8px;font-weight:600;display:flex;gap:6px;align-items:center;position:sticky;top:0}
.hllist .t button{margin-left:auto;border:0;background:#fff;color:#c00;border-radius:3px;cursor:pointer;font-size:11px}
.hllist .i{padding:3px 8px;border-bottom:1px solid #eee;cursor:pointer}.hllist .i:hover{background:#ffeceb}
.hllist .i b{display:inline-block;width:20px;color:#c00}
.hllist small{color:#666}
</style>
</head>
<body>
<header><h1 data-i="title">🌲 산림변화 의사결정 지원 — 춘천시 2019→2025</h1>
  <select id="langSel" title="Language" style="width:auto;margin-left:12px;padding:2px 6px;font-size:12px"><option value="ko">한국어</option><option value="en">English</option></select>
  <span class="st" id="status"></span></header>
<main>
<section id="side">
  <div id="tabs">
    <button data-p="q" class="on" data-i="tab_q">질의</button><button data-p="s" data-i="tab_s">장소</button><button data-p="a" data-i="tab_a">속성</button>
    <button data-p="r" data-i="tab_r">지역</button><button data-p="h" data-i="tab_h">보고서</button>
  </div>

  <div class="pane on" id="p-q">
    <div class="area"><span data-i="area">대상 지역</span>: <b id="areaLbl"></b>
      <div class="row">
        <select id="emdSel" style="width:auto;flex:1"><option value="" data-i="emd_pick">읍면동 선택…</option></select>
        <button class="b2" id="bboxBtn" data-i="bbox">지도 범위</button>
        <button class="b2" id="selBtn" data-i="sel">선택 소반</button>
        <button class="b2" id="clrBtn" data-i="all">전체</button>
      </div>
      <div class="muted" data-i="shift">소반을 Shift+클릭하면 여러 개를 선택합니다.</div>
    </div>
    <h3 data-i="query">질의</h3>
    <textarea id="qText" data-ip="q_ph"></textarea>
    <div id="examples"></div>
    <div class="row">
      <select id="mode" style="width:auto"><option value="auto" data-i="m_auto">자동</option><option value="llm" data-i="m_llm">Claude 에이전트</option><option value="rule" data-i="m_rule">규칙 기반</option></select>
      <button class="b" id="runBtn" data-i="run">질의 실행</button>
      <span class="muted" id="modeNote"></span>
    </div>
    <div class="log" id="log" hidden></div>
  </div>

  <div class="pane" id="p-s">
    <input id="sq" data-ip="s_ph">
    <div class="muted" style="margin:4px 0" data-i="s_help">결과를 누르면 지도로 이동하고 속성을 엽니다.</div>
    <div id="sres"></div>
  </div>

  <div class="pane" id="p-a"><div id="attr" class="muted" data-i="a_help">지도에서 소반·산지전용 필지·재해 지점을 누르세요.</div></div>

  <div class="pane" id="p-r">
    <div class="muted" data-i="r_help">질의 탭에서 지정한 대상 지역의 요약입니다 (LLM 없이 즉시 계산).</div>
    <div class="row"><button class="b2" id="sumBtn" data-i="sum">지역 요약 보기</button><button class="b" id="sumSave" data-i="sum_save">이 지역 보고서 저장</button></div>
    <div id="sum"></div>
  </div>

  <div class="pane" id="p-h"><div class="row"><button class="b2" id="runsBtn" data-i="refresh">새로고침</button></div><div id="runs"></div></div>
</section>

<div id="map"></div>

<section id="right">
  <div class="hd"><b id="repTitle" data-i="report">분석 보고서</b>
    <button class="b2" id="showMap" disabled data-i="show_map">지도에 표시</button><button class="b2" id="dlMd" disabled>MD</button>
    <button class="b2" id="dlHtml" disabled>HTML</button><button class="b2" id="printBtn" disabled data-i="print">인쇄·PDF</button></div>
  <div class="empty" id="repEmpty" data-i="rep_empty">질의를 실행하거나 '보고서' 탭에서 저장된 보고서를 고르면 여기에 표시됩니다.</div>
  <iframe id="rep" hidden></iframe>
</section>
</main>

async function showAttr(layer, fid, zoom) {
  tab('a');
  const d = await api(`/api/feature/${encodeURIComponent(layer)}/${fid}`);
  if (zoom) flash(d.bbox);
  const kv = Object.entries(d.attributes).filter(([k]) => k !== 'fid').map(([k, v]) => `<tr><td>${esc(tf(k))}</td><td>${fmt(v)}</td></tr>`).join('');
  let h = `<h3>${esc(t('attr_of')(tv(layer)))}</h3><table class="kv">${kv}</table>`;
  for (const [k, rows] of Object.entries(d.related)) h += `<h3>${esc(tf(k))} (${rows.length})</h3>` + (rows.length ? table(rows) : `<div class="muted">${t('none')}</div>`);
  if (layer === '소반' || layer === '산지전용') h += `<div class="row"><button class="b2" id="aTs">${t('b_ts')}</button>${layer === '소반' ? `<button class="b2" id="aEx">${t('b_ex')}</button><button class="b2" id="aSim">${t('b_sim')}</button>` : ''}</div><div id="ex"></div><div id="ts"></div>`;
  if (layer === '소반') {
    const id = d.attributes['단위ID'];
    h += `<div class="row"><button class="b2" id="aSel">${t('b_area')}</button><button class="b2" id="aAsk">${t('b_ask')}</button></div>`;
    $('#attr').innerHTML = h;
    $('#aSel').onclick = () => { if (!selected.has(id)) toggleSel(id); setArea({unit_ids: [...selected]}, t('sel_n')(selected.size)); };
    $('#aAsk').onclick = () => { selected = new Set([id]); L_['소반'].setStyle(styleUnit); setArea({unit_ids: [id]}, t('unit')(id));
      $('#qText').value = t('ask_q')(id); tab('q'); };
  } else $('#attr').innerHTML = h;
  if ($('#aTs')) $('#aTs').onclick = () => showTs(layer, fid);
  if ($('#aEx')) $('#aEx').onclick = () => showExplain(fid);
  if ($('#aSim')) $('#aSim').onclick = () => showSimilar(fid);
}

// ---- 시계열: Sentinel-2 NDVI(선)와 AlphaEarth 연속연도 임베딩 거리(막대) + 모델 예측
async function showTs(layer, fid) {
  $('#ts').innerHTML = `<div class="muted">${t('ts_wait')}</div>`;
  try {
    const r = await api(`/api/timeseries/${encodeURIComponent(layer)}/${fid}`);
    const ys = Object.keys(r['Sentinel-2_연별_평균']), nd = ys.map(y => r['Sentinel-2_연별_평균'][y].NDVI);
    const ae = Object.values(r['AlphaEarth_연속연도_임베딩거리']), W = 320, H = 150, x = i => 30 + i * (W - 50) / (ys.length - 1);
    const yN = v => 20 + (1 - v) * 100, aMax = Math.max(0.1, ...ae.filter(v => v !== null)), yA = v => 120 - v / aMax * 60;
    let svg = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;background:#fff;border:1px solid var(--bd);border-radius:4px">`;
    ae.forEach((v, i) => { if (v === null) return; const xm = (x(i) + x(i + 1)) / 2;
      svg += `<rect x="${xm - 7}" y="${yA(v)}" width="14" height="${120 - yA(v)}" fill="#7b2cbf" opacity="${v === aMax ? .9 : .35}"><title>AE ${ys[i]}→${ys[i + 1]}: ${v}</title></rect>`; });
    svg += `<polyline fill="none" stroke="#2f6b3a" stroke-width="2" points="${nd.map((v, i) => v === null ? '' : `${x(i)},${yN(v)}`).join(' ')}"/>`;
    nd.forEach((v, i) => { if (v !== null) svg += `<circle cx="${x(i)}" cy="${yN(v)}" r="2.5" fill="#2f6b3a"><title>NDVI ${ys[i]}: ${v}</title></circle>`; });
    ys.forEach((y, i) => svg += `<text x="${x(i)}" y="138" font-size="9" text-anchor="middle" fill="#666">${String(y).slice(2)}</text>`);
    svg += `<text x="4" y="14" font-size="10" fill="#2f6b3a">— NDVI(S2)</text><text x="80" y="14" font-size="10" fill="#7b2cbf">${t('ts_ae')}</text></svg>`;
    const fm = r['최종지도(AE+S2)'], mg = r['Mini-GFM(S2)'];
    const js = o => esc(JSON.stringify(Object.fromEntries(Object.entries(o).map(([k, v]) => [tv(k), v]))));
    $('#ts').innerHTML = svg + `<table class="kv">
      <tr><td>${t('ae_peak')}</td><td>${esc(r['AlphaEarth_최대변화구간'])} (2019→2025: ${fmt(r['AlphaEarth_2019→2025_거리'])})</td></tr>
      <tr><td>${t('fm_px')}</td><td>${js(fm['화소_구성(10 m)'])}</td></tr>
      <tr><td>${t('fm_yr')}</td><td>${js(fm['변화연도_화소'])}</td></tr>
      <tr><td>${t('fm_p')}</td><td>${js(fm['평균확률'])}</td></tr>
      <tr><td>${t('mg_px')}</td><td>${js(mg['화소_구성(20 m, 마스크 전)'])}</td></tr>
      <tr><td>${t('mg_p')}</td><td>${js(mg['평균확률'])}</td></tr></table>`;
  } catch (e) { $('#ts').innerHTML = t('err') + esc(e.message); }
}
function table(rows) {
  const cols = Object.keys(rows[0]);
  return `<table><tr>${cols.map(c => `<th>${esc(tf(c))}</th>`).join('')}</tr>` +
    rows.map(r => `<tr>${cols.map(c => `<td>${fmt(r[c])}</td>`).join('')}</tr>`).join('') + '</table>';
}

  '사업실적이 없으나 위성 변화가 집중된 소반은 어디인가?', '임상도 조사 이력과 연도별 임상 추정을 바탕으로 동면 국유림의 임상도 재조사 우선순위를 정리해줘',
  'AlphaEarth 분류모델로 본 북산면 국유림의 2019→2025 피복·임상 변화와, 임상 재판독 후보·산지 내 시설·나지 확대 의심 소반을 정리해줘',
  '2019~2025년 국유림에서 큰 변화 후 식생 회복이 더딘 소반을 찾고, 벌채·조림 이력과 비교해 현장 점검 소반을 추천해줘', '회복이 양호한 벌채지와 임베딩이 비슷한 소반을 찾아 경사·수종 차이와 함께 비교조사 후보를 정리해줘',
  '위성 변화는 있는데 2025 임상도에 반영되지 않은 임상도 갱신 검토 소반과 변화 구역 면적표를 정리해줘', '반복 교란 소반과 수분 스트레스 등 식생 이상 의심 소반을 찾아 변화의 의미를 설명해줘',
  '변화탐지 모델(최종지도·Mini-GFM)과 AlphaEarth·Sentinel-2 원자료가 함께 변화를 가리키는 소반과, 한 신호만 변화로 본 불확실한 소반을 구분해줘', '산지전용 고시 필지 중 위성에서 변화가 확인되는 곳은?',
  'AlphaEarth가 Sentinel-2보다 변화 탐지에 도움이 되는가?', '수확 실적이 있는데 변화가 관측되지 않은 소반(이행 확인 대상)은?'],
 en: ['For 2020–2024 forest change in the Chuncheon national forest, find stands where management records and satellite analysis disagree. Separate stands with detected change but no records from stands with records but weak change signals. Show forest-map change, disaster history, slope and forest-road access, and list the top 10 field-inspection candidates with reasons and uncertainty as a map and table.',
  'Where are stands with concentrated satellite change but no management records?', 'Using forest-map survey history and yearly forest-type estimates, rank stands in Dong-myeon national forest for forest-map re-survey.',
  'Using the AlphaEarth classifiers, summarize 2019→2025 land-cover and forest-type change in Buksan-myeon, with re-interpretation candidates and suspected non-forest-use expansion.',
  'Find national-forest stands with slow vegetation recovery after major change in 2019–2025 and recommend inspection stands by comparing harvest and planting records.',
  'Find stands whose embeddings resemble well-recovered harvest sites and list comparison candidates with slope and species differences.',
  'List stands with satellite change not yet reflected in the 2025 forest map, with a change-zone area table.', 'Find stands with repeated disturbance or possible vegetation stress and explain what the change means.',
  'Separate stands where the change models and AlphaEarth/Sentinel-2 data agree on change from uncertain stands flagged by only one signal.', 'Which forest-conversion notice parcels show change in satellite data?',
  'Does AlphaEarth help change detection more than Sentinel-2?', 'Which stands have harvest records but no observed change (to verify implementation)?']};
const EXL = EX[LANG] || EX.ko;
$('#examples').innerHTML = EXL.map((e, i) => `<span class="chip" data-i="${i}" title="${esc(e)}">${esc(e.length > 40 ? e.slice(0, 38) + '…' : e)}</span>`).join('');
document.querySelectorAll('#examples .chip').forEach(c => c.onclick = () => $('#qText').value = EXL[+c.dataset.i]);
let curRun = null;
$('#runBtn').onclick = async () => {
  const q = $('#qText').value.trim(); if (!q) return;
  $('#runBtn').disabled = true; $('#log').hidden = false; $('#log').textContent = '';
  try {
    const {job} = await post('/api/query', {query: q, area, mode: $('#mode').value, lang: LANG});
    while (true) {
      await new Promise(r => setTimeout(r, 1500));
      const j = await api('/api/job/' + job);
      $('#log').textContent = j.logs.join('\n'); $('#log').scrollTop = 1e9;
      if (j.status !== 'running') { if (j.run && j.status === 'done') openRun(j.run); break; }
    }
  } catch (e) { $('#log').textContent += '\n' + t('err') + e.message; }
  $('#runBtn').disabled = false;
};
function openRun(run) {
  curRun = run; $('#repEmpty').hidden = true; $('#rep').hidden = false;
  $('#rep').onload = () => { try { $('#repTitle').textContent = $('#rep').contentDocument.title || t('report'); } catch (e) {} };
  $('#rep').src = `/api/runs/${run}/report.html`;
  ['#showMap', '#dlMd', '#dlHtml', '#printBtn'].forEach(x => $(x).disabled = false);
  showResult(run);
}
$('#dlMd').onclick = () => location.href = `/api/runs/${curRun}/file/report.md`;
$('#dlHtml').onclick = () => location.href = `/api/runs/${curRun}/report.html?download=true`;
$('#printBtn').onclick = () => $('#rep').contentWindow.print();
$('#showMap').onclick = () => showResult(curRun);

// ---- 결과 강조: 나머지는 흐리게, 결과 소반은 노란 후광 + 색 경계 + 깜빡이는 번호 + 목록 패널
let hlGroup = null, hlCtl = null, hlIds = [];
function styleDim(f) {
  if (hlIds.includes(f.properties['단위ID'])) return {color: '#b30000', weight: 3, fillColor: '#ff3b1f', fillOpacity: 0.55};
  return {color: '#999', weight: 0.3, fillColor: JC[f.properties['판정']] || '#ccc', fillOpacity: 0.07};
}
function clearResult() {
  hlIds = []; if (hlGroup) map.removeLayer(hlGroup); if (hlCtl) map.removeControl(hlCtl); hlGroup = hlCtl = null;
  if (L_['소반']) { L_['소반'].setStyle(styleUnit); L_['산지전용'].setStyle(styleParcel); }
}
async function showResult(run) {
  let h = null;
  try { h = await api(`/api/runs/${run}/file/highlight.json`); } catch (e) {}
  if (!h) {   // 강조 정보가 없으면 보고서 본문의 소반ID 순서대로
    const tx = await (await fetch(`/api/runs/${run}/file/report.md`)).text();
    h = {title: t('rep_units'), unit_ids: [...new Set(tx.match(/\d{3}-\d{3}\/\d{3}-\d{3}/g) || [])], parcel_ids: []};
  }
  const groups = h.groups || [h];   // make_map 호출마다 한 묶음: 1번째 빨강 숫자, 2번째 보라 B1…, 3번째 파랑 C1…
  const GC = ['#ff3b1f', '#7b2cbf', '#1f78b4'], PRE = ['', 'B', 'C', 'D'];
  clearResult();
  hlIds = groups.flatMap(g => g.unit_ids || []);
  const pids = new Set(groups.flatMap(g => g.parcel_ids || []));
  if (!hlIds.length && !pids.size) return;
  L_['소반'].setStyle(styleDim);
  L_['산지전용'].setStyle(f => pids.has(f.properties['레코드ID']) ? {color: '#0b2a5c', weight: 4, fillColor: '#1f5fbf', fillOpacity: .85, opacity: 1}
                                                                  : {color: '#aaa', weight: 1, fillOpacity: .08, opacity: .3});
  hlGroup = L.featureGroup().addTo(map);
  const items = [];
  groups.forEach((g, gi) => {
    const col = GC[gi % GC.length], pre = PRE[gi] ?? `G${gi + 1}-`;
    items.push({head: g.title, col});
    (g.unit_ids || []).forEach((id, i) => {
      const l = L_['소반'].getLayers().find(x => x.feature.properties['단위ID'] === id); if (!l) return;
      const n = pre + (i + 1);
      L.geoJSON(l.feature, {style: {color: '#ffe600', weight: 10, opacity: .9, fill: false}, interactive: false}).addTo(hlGroup);   // 후광
      L.geoJSON(l.feature, {style: {color: col, weight: 3, fill: true, fillColor: col, fillOpacity: .45}, interactive: false}).addTo(hlGroup);
      L.marker(l.getBounds().getCenter(), {icon: L.divIcon({className: '', html: `<div class="hlnum" style="background:${col};width:${n.length > 2 ? 32 : 26}px">${n}</div>`,
        iconSize: [26, 26], iconAnchor: [13, 13]}), zIndexOffset: 1000 - gi * 100})
        .on('click', () => showAttr('소반', l.feature.properties.fid)).bindTooltip(`${n}. ${id}<br>${tv(l.feature.properties['판정'])}`).addTo(hlGroup);
      items.push({n, id, col, sub: `${l.feature.properties['읍면동'] || ''} · ${tv(l.feature.properties['판정'])}`, l});
    });
  });
  L_['산지전용'].getLayers().filter(l => pids.has(l.feature.properties['레코드ID'])).forEach(l => {
    L.circleMarker(l.getBounds().getCenter(), {radius: 9, color: '#ffe600', weight: 4, fillColor: '#1f5fbf', fillOpacity: 1}).addTo(hlGroup);
    items.push({n: '■', id: l.feature.properties['레코드ID'], col: '#1f5fbf', sub: l.feature.properties['주소'], l});
  });
  hlCtl = L.control({position: 'topleft'});
  hlCtl.onAdd = () => {
    const d = L.DomUtil.create('div', 'hllist');
    d.innerHTML = `<div class="t">${t('res_n')(items.filter(x => x.l).length)} <button>${t('clear')}</button></div>` +
      items.map((x, k) => x.head ? `<div style="padding:4px 8px;background:#f6f6f6;border-left:4px solid ${x.col};font-weight:600">${esc(x.head)}</div>`
        : `<div class="i" data-k="${k}"><b style="color:${x.col};width:auto;margin-right:6px">${x.n}</b>${esc(x.id)}<br><small>${esc(x.sub)}</small></div>`).join('');
    L.DomEvent.disableClickPropagation(d); L.DomEvent.disableScrollPropagation(d);
    d.querySelector('button').onclick = clearResult;
    d.querySelectorAll('.i').forEach(el => el.onclick = () => map.fitBounds(items[+el.dataset.k].l.getBounds(), {maxZoom: 16, padding: [60, 60]}));
    return d;
  };
  hlCtl.addTo(map);
  if (hlGroup.getLayers().length) map.fitBounds(hlGroup.getBounds(), {padding: [50, 50], maxZoom: 15});
}

// ---- 지역 요약
$('#sumBtn').onclick = async () => {
  $('#sum').innerHTML = `<div class="muted">${t('computing')}</div>`;
  try {
    const d = await post('/api/area_summary', area), s = d.summary;
    let h = `<h3>${esc(s['지역'] === '춘천시 전체' ? t('city') : s['지역'])}</h3><table class="kv">
      <tr><td>${t('nf')}</td><td>${fmt(s['국유림_소반'])} / ${fmt(s['국유림_면적_ha'])} ha</td></tr>
      <tr><td>${t('ae_ha')}</td><td>${fmt(s['AE_변화면적_ha'])} ha</td></tr><tr><td>${t('s2_ha')}</td><td>${fmt(s['S2_변화면적_ha'])} ha</td></tr>
      <tr><td>${t('dis')}</td><td>${esc(JSON.stringify(Object.fromEntries(Object.entries(s['재해_2019_2025']).map(([k, v]) => [tv(k), v]))))}</td></tr>
      <tr><td>${t('ae_yr')}</td><td>${esc(JSON.stringify(s['AE_변화연도별_소반수']))}</td></tr></table>`;
    if (s['판정별'].length) h += `<h3>${t('by_j')}</h3>` + table(s['판정별']);
    if (s['사업실적_2019_2025'].length) h += `<h3>${t('recs')}</h3>` + table(s['사업실적_2019_2025']);
    if (s['산지전용_필지'].length) h += `<h3>${t('conv')}</h3>` + table(s['산지전용_필지']);
    if (d.ranking.length) h += `<h3>${t('rank')}</h3>` + table(d.ranking.map(r => ({'소반': r['단위ID'], '판정': r['판정'], '점수': r['점수'], '안정성': r['순위안정성'], 'AE변화ha': r['AE_변화면적_ha']})));
    if (d.warnings.length) h += `<div class="muted">⚠ ${esc(d.warnings.join(' / '))}</div>`;
    $('#sum').innerHTML = h;
  } catch (e) { $('#sum').innerHTML = t('err') + esc(e.message); }
};
$('#sumSave').onclick = () => { $('#qText').value = t('save_q')($('#areaLbl').textContent);
  $('#mode').value = 'rule'; tab('q'); $('#runBtn').click(); };

// ---- 보고서 목록
async function loadRuns() {
  const rs = await api('/api/runs');
  $('#runs').innerHTML = rs.length ? rs.map(r => `<div class="res" data-r="${r.run}"><b>${esc(r.title)}</b><br><small>${r.run} · ${esc(r.mode || '')} · ${esc((r.query || '').slice(0, 60))}</small></div>`).join('')
    : `<div class="muted">${t('no_runs')}</div>`;
  document.querySelectorAll('#runs .res').forEach(el => el.onclick = () => openRun(el.dataset.r));
}
$('#runsBtn').onclick = loadRuns;

window.addEventListener('resize', () => map.invalidateSize());
$('#status').textContent = t('loading');
(async () => {
  meta = await api('/api/meta');
  meta.emd.forEach(e => $('#emdSel').insertAdjacentHTML('beforeend', `<option>${esc(e)}</option>`));
  $('#status').textContent = (meta.llm ? t('llm_on')(meta.model) : t('llm_off')) + t('models')(meta.models['최종지도(AE+S2)'], meta.models['Mini-GFM(S2)']);
  $('#modeNote').textContent = (meta.llm ? '' : t('no_key')) + t('rule_ko');
  await loadLayers();
  window.__ready = true;
})().catch(e => $('#status').textContent = t('err') + e.message);
</script>
</body>
